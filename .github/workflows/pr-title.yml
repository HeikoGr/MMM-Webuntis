name: PR title

on:
  pull_request:
    # edited: a renamed PR has to be checked again; synchronize: the required check has to
    # report on the current head commit.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest

    steps:
      # A squash merge turns the PR title into the commit on develop, and that commit is what
      # release-please reads - so the title is held to the same rules as every commit
      # (scripts/check-commit-msg.js, a plain Node script without dependencies).
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The scope check diffs base...head.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'

      - name: Validate PR title
        env:
          # Passed via env, not inlined: the title is user input.
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | node scripts/check-commit-msg.js --stdin

      # A PR typed chore/docs/test/... that changes runtime source would be released silently. The
      # release PR itself (chore, but it carries every change since the last release) is exempt.
      - name: Check the type against the diff
        if: github.head_ref != 'develop' && github.head_ref != 'release-ship'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/check-commit-scope.js \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
