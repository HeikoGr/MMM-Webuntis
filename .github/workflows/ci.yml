name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, spelling
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # lib/mmm-shared is a submodule; node_helper.js requires it at load time.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Test the minimum version declared in package.json engines, not the latest.
          # Otherwise the supported floor is never actually exercised.
          node-version: '20.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: node --run lint

      # Run the suite twice. Date handling is the module's core job, and a bug in it is only
      # visible when the host clock differs from the school timezone - a UTC-only run cannot see
      # it. Europe/Berlin is the zone virtually every installation runs in; UTC is pinned
      # explicitly so the runner default can never silently become the only zone under test.
      - name: Unit tests (UTC)
        run: node --run test
        env:
          TZ: UTC

      - name: Unit tests (Europe/Berlin)
        run: node --run test
        env:
          TZ: Europe/Berlin

      - name: Spell check
        run: node --run test:spelling

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only pull requests have a well-defined range of new commits to validate.
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Need the full range between base and head to lint every commit in the PR.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: |
          npx --no-install commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
