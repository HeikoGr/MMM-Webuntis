version: 2
updates:
  # Grouped minor/patch bumps: one PR and one CI run per day instead of one per package.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    # A fresh release waits 3 days: a compromised or broken one is usually pulled by then.
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    # A fresh release waits 3 days: a compromised or broken one is usually pulled by then.
    cooldown:
      default-days: 3
    # Split by dependency type: devDependencies merge themselves (dependabot-auto-merge.yml),
    # runtime dependencies wait for a review - one group each, so a tooling bump never waits
    # behind a runtime bump in the same PR.
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]

  # lib/mmm-shared is a git submodule - this opens a PR whenever it moves on main.
  # CI checks it out recursively, so the module's own tests validate the new version
  # before the PR can be merged.
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: develop
    schedule:
      interval: daily
