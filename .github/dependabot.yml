version: 2
updates:
  # Grouped minor/patch bumps: one PR and one CI run per week instead of one per package.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  # lib/mmm-shared is a git submodule - this opens a PR whenever it moves on main.
  # CI checks it out recursively, so the module's own tests validate the new version
  # before the PR can be merged.
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
